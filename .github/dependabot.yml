version: 2
updates:
  # Propose Node base image bumps (security releases) for the Dockerfile.
  # When Dependabot opens a PR, dependabot-sync-node.yml automatically updates
  # node-version in workflows and mise.toml to match.
  - package-ecosystem: docker
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
