name: Update Conference List

on:
push:
branches:
- conference-dropdown-search-selection
schedule:
# Run every Monday at 2 AM UTC
- cron: "0 2 * * 1"
workflow_dispatch: # Allow manual trigger

jobs:
collect-conferences:
runs-on: ubuntu-latest
name: Collect Conferences
steps:
- name: Checkout code
uses: actions/checkout@v4
with:
fetch-depth: 0
  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20
      cache: pnpm

  - name: Install pnpm
    uses: pnpm/action-setup@v2
    with:
      version: 9

  - name: Install dependencies
    run: pnpm install --frozen-lockfile

  - name: Collect conference data
    run: pnpm exec tsx scripts/conference-collecting/main.ts

  - name: Check for changes
    id: git-status
    run: |
      if git diff --quiet; then
        echo "changed=false" >> $GITHUB_OUTPUT
      else
        echo "changed=true" >> $GITHUB_OUTPUT
      fi

  - name: Commit changes
    if: steps.git-status.outputs.changed == 'true'
    run: |
      git config --local user.email "action@github.com"
      git config --local user.name "GitHub Action"
      git add scripts/conference-collecting/conference-postings.json
      git commit -m "chore: update conference list [skip ci]"

  - name: Push changes
    if: steps.git-status.outputs.changed == 'true'
    run: |
      git push

  - name: Create Pull Request
    if: steps.git-status.outputs.changed == 'true'
    uses: peter-evans/create-pull-request@v5
    with:
      commit-message: "chore: update conference list"
      title: "chore: update conference list"
      body: |
        Automated conference list update from weekly collection job.

        Generated at: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      branch: update/conferences-${{ github.run_number }}
      base: staging
      delete-branch: true

