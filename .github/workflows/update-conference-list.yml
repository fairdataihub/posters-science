name: Update Conference List

on:
  push:
    branches:
      - conference-dropdown-search-selection

  schedule:
    - cron: "0 2 * * 1"

  workflow_dispatch:

jobs:
  collect-conferences:
    name: Collect Conferences
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect conference data
        run: pnpm exec tsx scripts/conference-collecting/main.ts

      - name: Check for changes
        id: git-status
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.git-status.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update conference list"
          title: "chore: update conference list"
          body: |
            Automated conference list update.

            Generated at:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          branch: update/conferences-${{ github.run_number }}
          base: conference-dropdown-search-selection
          delete-branch: true
